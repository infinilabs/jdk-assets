name: Sync Oracle GraalVM 25 (via GDS)

on:
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: "是否强制覆盖已存在版本"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            plat: linux-x64
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            plat: linux-aarch64
            ext: tar.gz
          - runner: macos-latest
            plat: macos-aarch64
            ext: tar.gz
          - runner: windows-latest
            plat: windows-x64
            ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup Oracle GraalVM 25 LTS via GDS
        uses: graalvm/setup-graalvm@v1
        with:
          version: "25.0"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify >= 25.0.5.1 & package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          JDK_DIR="${GRAALVM_HOME:-${JAVA_HOME:-}}"
          if [ -z "${JDK_DIR}" ] || [ ! -d "${JDK_DIR}" ]; then
            JDK_DIR="$(dirname "$(dirname "$(command -v java)")")"
          fi
          echo "JDK_DIR=${JDK_DIR}"
          cat "${JDK_DIR}/release"
          java_out="$("${JDK_DIR}/bin/java" -version 2>&1)"
          echo "=== java -version ==="
          echo "${java_out}"

          # 从 java -version 输出中提取完整版本（如 25.0.5.1）
          actual_version="$(echo "${java_out}" | grep -oE '25\.[0-9]+(\.[0-9]+){1,2}' | head -n1)"
          echo "Detected actual_version=${actual_version}"

          IFS='.' read -r v1 v2 v3 v4 _rest <<< "${actual_version}.0.0.0"
          ver_ok=false
          if [ "${v1}" -gt 25 ]; then ver_ok=true
          elif [ "${v1}" -eq 25 ] && [ "${v2}" -gt 0 ]; then ver_ok=true
          elif [ "${v1}" -eq 25 ] && [ "${v2}" -eq 0 ] && [ "${v3}" -gt 5 ]; then ver_ok=true
          elif [ "${v1}" -eq 25 ] && [ "${v2}" -eq 0 ] && [ "${v3}" -eq 5 ] && [ "${v4}" -ge 1 ]; then ver_ok=true
          fi
          if [ "${ver_ok}" != "true" ]; then
            echo "ERROR: GraalVM ${actual_version} < 25.0.5.1 (未修复 Java4Shell)!"
            exit 1
          fi

          base_dir="$(dirname "${JDK_DIR}")"
          folder_name="$(basename "${JDK_DIR}")"
          pkg_name="graalvm-jdk-${actual_version}_${{ matrix.plat }}_bin.${{ matrix.ext }}"

          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            COPYFILE_DISABLE=1 tar -czf "out/${pkg_name}" -C "${base_dir}" "${folder_name}"
          else
            (cd "${base_dir}" && 7z a -tzip "${GITHUB_WORKSPACE}/out/${pkg_name}" "${folder_name}" >/dev/null)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-${{ matrix.plat }}
          path: out/*

  publish:
    needs: build-assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate .sha512 & publish Release
        run: |
          set -euo pipefail
          shopt -s nullglob

          ver="$(ls dist/*.tar.gz | head -n1 | sed -E 's/.*graalvm-jdk-([^_]+)_.*/\1/')"
          tag="graalvm-${ver}"

          (
            cd dist
            archives=( *.tar.gz *.zip )
            if [ "${#archives[@]}" -eq 0 ]; then
              echo "ERROR: No archives found in dist/"
              exit 1
            fi
            for f in "${archives[@]}"; do
              sha512sum "${f}" > "${f}.sha512"
            done
            sha256sum "${archives[@]}" > SHA256SUMS.txt
            sha512sum "${archives[@]}" > SHA512SUMS.txt
          )

          echo "=== Generated Release Assets ==="
          ls -lh dist/
          cat dist/SHA512SUMS.txt

          REPO="${{ github.repository }}"
          if gh release view "${tag}" --repo "${REPO}" >/dev/null 2>&1; then
            if [ "${{ inputs.force_overwrite }}" != "true" ]; then
              echo "Release ${tag} already exists. Skip."
              exit 0
            fi
            gh release upload "${tag}" dist/* --clobber --repo "${REPO}"
          else
            gh release create "${tag}" dist/* \
              --repo "${REPO}" \
              --target "${{ github.ref_name }}" \
              --title "Oracle GraalVM ${ver} (LTS)" \
              --notes "Synced via graalvm/setup-graalvm (Oracle GDS, GFTC License). Patched for Java4Shell (CVE-2026-114938)."
          fi