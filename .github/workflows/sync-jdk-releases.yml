name: Sync JDK to Releases

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "选择 JDK 品牌"
        type: choice
        required: true
        default: "tencent-kona"
        options:
          - tencent-kona
          - eclipse-temurin
          - amazon-corretto
      major_version:
        description: "选择 JDK 主版本"
        type: choice
        required: true
        default: "21"
        options:
          - "17"
          - "21"
          - "25"
      require_patched:
        description: "是否强制校验版本"
        type: boolean
        default: true
      force_overwrite:
        description: "是否强制覆盖已存在版本"
        type: boolean
        default: false

# 同一品牌排队执行，防止同时跑 17 和 21 时并发创建同一个 Release 撞车
concurrency:
  group: sync-jdk-${{ inputs.brand }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-jdk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRAND: ${{ inputs.brand }}
      MAJOR_VER: ${{ inputs.major_version }}
      REQUIRE_PATCHED: ${{ inputs.require_patched }}
    steps:
      - name: Validate selection & set minimum patched version
        run: |
          set -euo pipefail
          case "${MAJOR_VER}" in
            17) MIN_PATCHED="17.0.21.1" ;;
            21) MIN_PATCHED="21.0.13.1" ;;
            25) MIN_PATCHED="25.0.5.1" ;;
            *) echo "Unsupported major version: ${MAJOR_VER}"; exit 1 ;;
          esac

          case "${BRAND}" in
            tencent-kona)    BRAND_SHORT="kona";     RELEASE_TITLE="Tencent Kona JDK" ;;
            eclipse-temurin) BRAND_SHORT="temurin";  RELEASE_TITLE="Eclipse Temurin JDK" ;;
            amazon-corretto) BRAND_SHORT="corretto"; RELEASE_TITLE="Amazon Corretto JDK" ;;
            *) echo "Unsupported brand: ${BRAND}"; exit 1 ;;
          esac

          echo "MIN_PATCHED=${MIN_PATCHED}" >> "$GITHUB_ENV"
          echo "BRAND_SHORT=${BRAND_SHORT}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${BRAND_SHORT}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"

      - name: Download, verify, rename & generate .sha512 (${{ inputs.brand }} ${{ inputs.major_version }})
        run: |
          set -euo pipefail
          mkdir -p work dist
          shopt -s nullglob

          check_patched_version() {
            local ver="$1"
            if [ "${REQUIRE_PATCHED}" = "true" ]; then
              if [ "$(printf '%s\n' "${MIN_PATCHED}" "${ver}" | sort -V | head -n1)" != "${MIN_PATCHED}" ]; then
                echo "ERROR: ${BRAND} version ${ver} < ${MIN_PATCHED} (未包含 Java4Shell CVE-2026-114938 修复，已拦截发布！)"
                exit 1
              fi
            fi
          }

          case "${BRAND}" in
            tencent-kona)
              repo="Tencent/TencentKona-${MAJOR_VER}"
              release_json="$(curl -fsSL --retry 3 --retry-delay 5 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${repo}/releases/latest")"

              upstream_tag="$(echo "${release_json}" | jq -r '.tag_name')"
              asset_count="$(echo "${release_json}" | jq '.assets | length')"
              echo "Upstream ${repo} latest tag: ${upstream_tag}, assets: ${asset_count}"
              if [ "${asset_count}" -eq 0 ]; then
                echo "ERROR: Release ${upstream_tag} has no binary assets uploaded yet!"
                exit 1
              fi

              echo "${release_json}" | jq -r '.assets[] | "\(.name)\t\(.browser_download_url)"' | \
              while IFS=$'\t' read -r name url; do
                echo "Downloading ${name} ..."
                curl -fsSL --retry 3 --retry-delay 5 -o "work/${name}" "${url}"
              done

              for archive in work/*.tar.gz work/*.zip; do
                if [ -f "${archive}.md5" ]; then
                  expected="$(grep -oE '(^|[^0-9a-fA-F])[0-9a-fA-F]{32}([^0-9a-fA-F]|$)' "${archive}.md5" | grep -oE '[0-9a-fA-F]{32}' | head -n1 | tr '[:upper:]' '[:lower:]')"
                  actual="$(md5sum "${archive}" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
                  if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
                    echo "ERROR: MD5 mismatch for $(basename "${archive}")"
                    echo "  raw .md5 : $(cat "${archive}.md5")"
                    echo "  expected : ${expected}"
                    echo "  actual   : ${actual}"
                    exit 1
                  fi
                  echo "Verified MD5: $(basename "${archive}") (${actual})"
                fi

                fname="$(basename "${archive}")"
                case "${fname}" in
                  *linux-x86_64*.tar.gz|*linux-x64*.tar.gz)
                    target="kona-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" ;;
                  *linux-aarch64*.tar.gz)
                    target="kona-jdk-${MAJOR_VER}_linux-aarch64_bin.tar.gz" ;;
                  *macosx-aarch64*.tar.gz|*macos-aarch64*.tar.gz)
                    target="kona-jdk-${MAJOR_VER}_macos-aarch64_bin.tar.gz" ;;
                  *macosx-x86_64*.tar.gz|*macos-x64*.tar.gz)
                    target="kona-jdk-${MAJOR_VER}_macos-x64_bin.tar.gz" ;;
                  *windows-x86_64*.zip|*windows-x64*.zip)
                    target="kona-jdk-${MAJOR_VER}_windows-x64_bin.zip" ;;
                  *)
                    echo "WARN: Unrecognized archive name ${fname}, skipping."
                    continue ;;
                esac
                mv "${archive}" "dist/${target}"
              done

              if [ ! -f "dist/kona-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" ]; then
                echo "ERROR: Missing kona-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz! Found in dist/:"
                ls -la dist/
                exit 1
              fi

              mkdir -p work/extract
              tar -xzf "dist/kona-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" -C work/extract --strip-components=1
              java_ver_raw="$(work/extract/bin/java -version 2>&1)"
              actual_version="$(awk -F'"' '/^JAVA_VERSION=/{print $2}' work/extract/release)"
              check_patched_version "${actual_version}"
              SOURCE_DESC="[${repo} (${upstream_tag})](https://github.com/${repo}/releases/tag/${upstream_tag}) (GPLv2+CE)"
              ;;

            eclipse-temurin)
              PLATFORMS=(
                "linux:x64:linux-x64:tar.gz"
                "linux:aarch64:linux-aarch64:tar.gz"
                "mac:aarch64:macos-aarch64:tar.gz"
                "mac:x64:macos-x64:tar.gz"
                "windows:x64:windows-x64:zip"
              )
              release_name=""
              for item in "${PLATFORMS[@]}"; do
                IFS=':' read -r os arch target_plat ext <<< "${item}"
                meta_url="https://api.adoptium.net/v3/assets/latest/${MAJOR_VER}/hotspot?os=${os}&architecture=${arch}&image_type=jdk"
                json="$(curl -fsSL --retry 3 --retry-delay 5 "${meta_url}")"
                if [ "$(echo "${json}" | jq 'length')" -eq 0 ]; then
                  echo "WARN: No asset returned for ${os}:${arch}, skipping."
                  continue
                fi

                pkg_name="$(echo "${json}" | jq -r '.[0].binary.package.name')"
                pkg_link="$(echo "${json}" | jq -r '.[0].binary.package.link')"
                pkg_sha="$(echo "${json}" | jq -r '.[0].binary.package.checksum' | tr '[:upper:]' '[:lower:]')"
                item_rel="$(echo "${json}" | jq -r '.[0].release_name')"
                item_quad="$(echo "${json}" | jq -r '.[0].version_data | "\(.major).\(.minor).\(.security).\(.patch // 0)"')"

                if [ "${REQUIRE_PATCHED}" = "true" ] && [ "$(printf '%s\n' "${MIN_PATCHED}" "${item_quad}" | sort -V | head -n1)" != "${MIN_PATCHED}" ]; then
                  echo "WARN: ${os}:${arch} latest is still ${item_rel} (< ${MIN_PATCHED}), skipping unpatched build."
                  continue
                fi

                target="temurin-jdk-${MAJOR_VER}_${target_plat}_bin.${ext}"
                echo "Downloading ${pkg_name} (${item_rel}) -> ${target} ..."
                curl -fsSL --retry 3 --retry-delay 5 -o "dist/${target}" "${pkg_link}"
                actual="$(sha256sum "dist/${target}" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
                if [ "${pkg_sha}" != "${actual}" ]; then
                  echo "ERROR: SHA256 mismatch for ${pkg_name} (expected=${pkg_sha}, actual=${actual})"
                  exit 1
                fi
                echo "Verified SHA256: ${target} (${actual})"
                release_name="${item_rel}"
              done

              if [ -z "${release_name}" ] || [ ! -f "dist/temurin-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" ]; then
                echo "ERROR: No patched ${BRAND} ${MAJOR_VER} release found (>= ${MIN_PATCHED})!"
                exit 1
              fi

              mkdir -p work/extract
              tar -xzf "dist/temurin-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" -C work/extract --strip-components=1
              java_ver_raw="$(work/extract/bin/java -version 2>&1)"
              SOURCE_DESC="Eclipse Adoptium official release ${release_name} (GPLv2+CE)"
              ;;

            amazon-corretto)
              PLATFORMS=(
                "x64-linux:linux-x64:tar.gz"
                "aarch64-linux:linux-aarch64:tar.gz"
                "aarch64-macos:macos-aarch64:tar.gz"
                "x64-macos:macos-x64:tar.gz"
                "x64-windows:windows-x64:zip"
              )
              for item in "${PLATFORMS[@]}"; do
                IFS=':' read -r src_plat target_plat ext <<< "${item}"
                src_file="amazon-corretto-${MAJOR_VER}-${src_plat}-jdk.${ext}"
                url="https://corretto.aws/downloads/latest/${src_file}"
                sha_url="https://corretto.aws/downloads/latest_sha256/${src_file}"
                target="corretto-jdk-${MAJOR_VER}_${target_plat}_bin.${ext}"

                echo "Downloading ${src_file} -> ${target} ..."
                curl -fsSL --retry 3 --retry-delay 5 -o "dist/${target}" "${url}"
                expected="$(curl -fsSL --retry 3 --retry-delay 5 "${sha_url}" | grep -oE '[0-9a-fA-F]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
                actual="$(sha256sum "dist/${target}" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
                if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
                  echo "ERROR: SHA256 mismatch for ${src_file} (expected=${expected}, actual=${actual})"
                  exit 1
                fi
                echo "Verified SHA256: ${target} (${actual})"
              done

              mkdir -p work/extract
              tar -xzf "dist/corretto-jdk-${MAJOR_VER}_linux-x64_bin.tar.gz" -C work/extract --strip-components=1
              java_ver_raw="$(work/extract/bin/java -version 2>&1)"
              actual_version="$(awk -F'"' '/^JAVA_VERSION=/{print $2}' work/extract/release)"
              check_patched_version "${actual_version}"
              SOURCE_DESC="Amazon Corretto ${actual_version} official release (GPLv2+CE)"
              ;;
          esac

          echo "=== Verified Java Output ==="
          echo "${java_ver_raw}"

          (
            cd dist
            archives=( *.tar.gz *.zip )
            if [ "${#archives[@]}" -eq 0 ]; then
              echo "ERROR: No archive files found in dist/"
              exit 1
            fi
            for f in "${archives[@]}"; do
              sha512sum "${f}" > "${f}.sha512"
            done
            sha256sum "${archives[@]}" > "${BRAND_SHORT}-jdk-${MAJOR_VER}_SHA256SUMS.txt"
            sha512sum "${archives[@]}" > "${BRAND_SHORT}-jdk-${MAJOR_VER}_SHA512SUMS.txt"
          )

          echo "=== Generated Release Assets ==="
          ls -lh dist/

          {
            printf '### JDK %s (%s)\n' "${MAJOR_VER}" "${SOURCE_DESC}"
            printf 'Java4Shell (CVE-2026-114938) check (`require_patched=%s`, min=`%s`): **PASSED**\n\n' "${REQUIRE_PATCHED}" "${MIN_PATCHED}"
            printf '```text\n%s\n```\n' "${java_ver_raw}"
          } > work/release_notes.md

      - name: Publish Release
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${REPO}" --json assets -q '.assets[].name')"
            if echo "${existing_assets}" | grep -q "^${BRAND_SHORT}-jdk-${MAJOR_VER}_"; then
              if [ "${{ inputs.force_overwrite }}" != "true" ]; then
                echo "Assets for ${BRAND_SHORT}-jdk-${MAJOR_VER} already exist in release ${RELEASE_TAG}. Skip (check force_overwrite to update)."
                exit 0
              fi
            fi
            gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${REPO}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${REPO}" \
              --target "${{ github.ref_name }}" \
              --title "${RELEASE_TITLE}" \
              --notes-file work/release_notes.md
          fi